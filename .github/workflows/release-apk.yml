name: Publish APK to Release

# When you publish a GitHub Release (e.g. v1.0.0-preview), this workflow builds
# the Android APK in the cloud and attaches it directly to the release, so the
# APK can be downloaded with a single tap from a phone browser.
#
# Usage (from github.com or the GitHub mobile app):
#   Releases → Draft a new release → tag v1.0.0-preview → Publish release
# The APK appears under "Assets" as tradeos-ai-<tag>.apk once the build finishes.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Prepare release APK
        run: |
          TAG="${{ github.event.release.tag_name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "tradeos-ai-${TAG}.apk"
          ls -la "tradeos-ai-${TAG}.apk"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: tradeos-ai-${{ github.event.release.tag_name }}.apk
