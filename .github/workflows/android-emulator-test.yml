name: Android Emulator Cold Start Test

# Functional cold-start test on a real Android emulator (API 34):
# builds the RELEASE APK (the same artifact users install), installs it,
# launches the app, waits, then captures a screenshot and the full logcat.
# Proves the app actually reaches Home instead of getting stuck on the
# splash screen.
#
# Trigger: Actions tab → "Android Emulator Cold Start Test" → Run workflow.

on:
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Configure release signing
        run: python3 .github/scripts/configure-release-signing.py
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Cold start on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            set -x
            adb install android/app/build/outputs/apk/release/app-release.apk
            # Cold start: force-stop first to guarantee a fresh process
            adb shell am force-stop com.tradeosai.app
            adb shell am start -n com.tradeosai.app/.MainActivity
            # Wait for the app to (hopefully) reach Home
            sleep 30
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/screenshot-coldstart.png"
            adb logcat -d > "$GITHUB_WORKSPACE/logcat-full.txt"
            adb logcat -d '*:E' > "$GITHUB_WORKSPACE/logcat-errors.txt"
            echo "--- resumed activity ---"
            adb shell dumpsys activity activities | grep -i -m3 "mResumedActivity\|tradeosai" || true

      - name: Upload cold-start evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coldstart-evidence
          path: |
            screenshot-coldstart.png
            logcat-full.txt
            logcat-errors.txt
          if-no-files-found: warn
